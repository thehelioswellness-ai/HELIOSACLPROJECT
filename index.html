<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kate Sneddon | Helios ACL Project</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #171717;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      text-align: center;
    }

    .content {
      width: 100%;
      max-width: 650px;
    }

    .photo {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 30%;
      margin-bottom: 18px;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .title {
      font-size: 15px;
      color: #666;
      margin-bottom: 40px;
    }

    h1 {
      font-size: clamp(36px, 6vw, 58px);
      line-height: 1.08;
      letter-spacing: -1.5px;
      margin: 0 0 36px;
    }

    .highlight {
      color: #e86624;
    }

    .button {
      display: inline-block;
      background: #e86624;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      padding: 17px 32px;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 30px 20px;
      }

      .button {
        display: block;
        width: 100%;
      }
    }
  </style>
